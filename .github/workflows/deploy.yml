name: Security Gate & Docker Hub Release — OnionTalk Relay Rust Native

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix-relay-rust-gate:
    name: "🦀 Strix Relay Rust Native Zero-Leak & Protocol Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Mandatory Zero-Leak, Release Docs & OSV.dev Cargo.lock CVE Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zero_leak_scanner.py
          python3 scripts/verify_release_docs.py
          python3 - <<'PY'
          import json, os, pathlib, re, sys, urllib.request
          lock_path = pathlib.Path("Cargo.lock")
          pkgs = list(dict.fromkeys(re.findall(r'\[\[package\]\]\s+name\s*=\s*"([^"]+)"\s+version\s*=\s*"([^"]+)"', lock_path.read_text("utf-8"))))
          if not pkgs:
              print("[OSV-GATE] 0 packages parsed from Cargo.lock", file=sys.stderr)
              sys.exit(1)
          cache, blocking = {}, []
          for i in range(0, len(pkgs), 500):
              chunk = pkgs[i:i+500]
              body = json.dumps({"queries": [{"package": {"name": n, "ecosystem": "crates.io"}, "version": v} for n, v in chunk]}).encode()
              req = urllib.request.Request("https://api.osv.dev/v1/querybatch", data=body, method="POST", headers={"Content-Type": "application/json", "User-Agent": "oniontalk-relay-osv-gate/1.0"})
              resp = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
              for (n, v), r in zip(chunk, resp.get("results") or []):
                  for ve in r.get("vulns") or []:
                      vid = ve.get("id", "")
                      if vid not in cache:
                          cache[vid] = json.loads(urllib.request.urlopen(f"https://api.osv.dev/v1/vulns/{vid}", timeout=15).read().decode())
                      doc = cache[vid]
                      aliases = [str(a) for a in (doc.get("aliases") or [])]
                      has_cve = vid.startswith(("CVE-", "GHSA-")) or any(a.startswith(("CVE-", "GHSA-")) for a in aliases)
                      dbs_list = [(a.get("database_specific") or {}) for a in (doc.get("affected") or [])]
                      info_tags = {str(d["informational"]).lower() for d in dbs_list if d.get("informational")}
                      cats = {str(c).lower() for d in dbs_list for c in (d.get("categories") or [])}
                      has_cvss = any(bool(d.get("cvss")) for d in dbs_list)
                      slc = str(doc.get("summary") or "").lower()
                      if not has_cve and not doc.get("severity") and not has_cvss and not cats and (info_tags == {"unmaintained"} or (not info_tags and ("is unmaintained" in slc or "no longer maintained" in slc))):
                          continue
                      blocking.append(f"{n}@{v} -> {vid} ({','.join(aliases) or doc.get('summary', 'security-advisory')})")
          if blocking:
              for b in blocking:
                  print(f"[OSV-GATE] BLOCKED: {b}", file=sys.stderr)
              sys.exit(1)
          print(f"[OSV-GATE] PASS: {len(pkgs)} crates in Cargo.lock verified clean via OSV.dev")
          PY

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry (Zero Target Build-Dir Cache)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Build Release Binary & Run Strix Relay Security Gate (Zero-Leak + HTTP 426 + HTTP 401 + Health)
        run: |
          cargo test --release --locked -- --nocapture
          cargo build --release --locked

  docker-build-and-publish:
    name: "🐳 Hardened Rust Relay Docker Build & Docker Hub Push"
    needs: [strix-relay-rust-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Crate Version Dynamically & Build Hardened Non-Root Relay Image
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$VER" ]; then
            echo "[FATAL] Could not parse version from Cargo.toml"
            exit 1
          fi
          echo "RELAY_VER=${VER}" >> "$GITHUB_ENV"
          docker build \
            -t "eriktonon/oniontalk:${VER}" \
            -t "eriktonon/oniontalk:v${VER}" \
            -t "eriktonon/oniontalk:latest" \
            .
          docker run --rm --entrypoint /bin/sh "eriktonon/oniontalk:${VER}" -c 'test "$(id -u)" = "10014" && test -x /usr/local/bin/oniontalk-relay-rs && echo "[OK] Non-Root UID 10014 Rust Native Relay Binary Verified ($VER)"'

      - name: Audit Relay Container Debian:12 Packages (/var/lib/dpkg/status) Against OSV.dev
        run: |
          docker run --rm --entrypoint /bin/cat "eriktonon/oniontalk:${RELAY_VER}" /var/lib/dpkg/status > /tmp/relay_dpkg_status.txt
          python3 - << 'PY'
          import concurrent.futures, json, pathlib, re, sys, time, urllib.request

          def char_order(ch):
              if ch == "~": return -1
              if ch is None: return 0
              return ord(ch) if ch.isalpha() else ord(ch) + 256

          def verrevcmp(a, b):
              i, j, la, lb = 0, 0, len(a), len(b)
              while i < la or j < lb:
                  while (i < la and not a[i].isdigit()) or (j < lb and not b[j].isdigit()):
                      ca = a[i] if (i < la and not a[i].isdigit()) else None
                      cb = b[j] if (j < lb and not b[j].isdigit()) else None
                      oa, ob = char_order(ca), char_order(cb)
                      if oa != ob: return -1 if oa < ob else 1
                      if ca is not None: i += 1
                      if cb is not None: j += 1
                  ia = i
                  while i < la and a[i].isdigit(): i += 1
                  jb = j
                  while j < lb and b[j].isdigit(): j += 1
                  na = int(a[ia:i]) if ia < i else 0
                  nb = int(b[jb:j]) if jb < j else 0
                  if na != nb: return -1 if na < nb else 1
              return 0

          def deb_ver_cmp(v1, v2):
              e1, r1 = (int(v1.split(":", 1)[0]), v1.split(":", 1)[1]) if ":" in v1 else (0, v1)
              e2, r2 = (int(v2.split(":", 1)[0]), v2.split(":", 1)[1]) if ":" in v2 else (0, v2)
              if e1 != e2: return -1 if e1 < e2 else 1
              u1, d1 = r1.rsplit("-", 1) if "-" in r1 else (r1, "")
              u2, d2 = r2.rsplit("-", 1) if "-" in r2 else (r2, "")
              c = verrevcmp(u1, u2)
              return c if c != 0 else verrevcmp(d1, d2)

          st = pathlib.Path("/tmp/relay_dpkg_status.txt").read_text(encoding="utf-8", errors="replace")
          sources = {}
          for stanza in st.split("\n\n"):
              if "Status: install ok installed" not in stanza: continue
              pm = re.search(r"^Package:\s*(\S+)", stanza, re.M)
              vm = re.search(r"^Version:\s*(\S+)", stanza, re.M)
              sm = re.search(r"^Source:\s*(\S+)(?:\s*\(([^)]+)\))?", stanza, re.M)
              if not pm or not vm: continue
              src_name = sm.group(1) if sm else pm.group(1)
              src_ver = sm.group(2) if (sm and sm.group(2)) else re.sub(r"\+b\d+$", "", vm.group(1))
              sources[src_name] = src_ver

          for req_pkg in ("tor", "openssl", "zlib", "curl"):
              if req_pkg not in sources:
                  print(f"[RELAY-DPKG-OSV] ERROR: Expected runtime package '{req_pkg}' missing from dpkg status!", file=sys.stderr)
                  sys.exit(1)

          pkgs = sorted(sources.items())
          req = urllib.request.Request(
              "https://api.osv.dev/v1/querybatch",
              data=json.dumps({"queries": [{"package": {"name": n, "ecosystem": "Debian:12"}, "version": v} for n, v in pkgs]}).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "oniontalk-relay-dpkg-osv-gate/1.0"},
          )
          results = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())["results"]
          unique_vids = sorted({ve["id"] for r in results for ve in (r.get("vulns") or []) if ve.get("id")})

          def fetch_one(vid):
              for attempt in range(3):
                  try:
                      r = urllib.request.Request(f"https://api.osv.dev/v1/vulns/{vid}", headers={"User-Agent": "oniontalk-relay-dpkg-osv-gate/1.0"})
                      with urllib.request.urlopen(r, timeout=15) as resp:
                          return vid, json.loads(resp.read().decode())
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(0.5 + attempt)

          cache = {}
          if unique_vids:
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                  for vid, doc in pool.map(fetch_one, unique_vids):
                      cache[vid] = doc

          blocking = []
          for (src_name, inst_ver), r in zip(pkgs, results):
              for ve in r.get("vulns") or []:
                  doc = cache.get(ve.get("id", "")) or {}
                  for aff in doc.get("affected") or []:
                      apkg = aff.get("package") or {}
                      if apkg.get("ecosystem") == "Debian:12" and apkg.get("name") == src_name:
                          for rng in aff.get("ranges") or []:
                              for ev in rng.get("events") or []:
                                  fx = str(ev.get("fixed") or "").strip()
                                  if fx and fx != "0" and deb_ver_cmp(inst_ver, fx) < 0:
                                      blocking.append(f"{src_name}@{inst_ver} < fixed {fx} ({ve['id']})")

          if blocking:
              for b in blocking:
                  print(f"[RELAY-DPKG-OSV] BLOCKED: {b}", file=sys.stderr)
              sys.exit(1)
          print(f"[RELAY-DPKG-OSV] PASS: {len(pkgs)} Debian:12 packages in eriktonon/oniontalk verified clean (0 unpatched DSAs/CVEs).")
          PY

      - name: Push Verified Relay Images to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push "eriktonon/oniontalk:${RELAY_VER}"
            docker push "eriktonon/oniontalk:v${RELAY_VER}"
            docker push "eriktonon/oniontalk:latest"
          else
            echo "[INFO] DOCKERHUB secrets not configured; skipping remote registry push."
          fi
