name: Security Gate & Docker Hub Release — OnionTalk Relay Rust Native

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELAY_VERSION_TAG: v1.5.7

jobs:
  strix-relay-rust-gate:
    name: "🦀 Strix Relay Rust Native Zero-Leak & Protocol Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary & Run Strix Relay Security Gate (Zero-Leak + HTTP 426 + HTTP 401 + Health)
        run: |
          cargo test --release --locked -- --nocapture
          cargo build --release --locked

  docker-build-and-publish:
    name: "🐳 Hardened Rust Relay Docker Build & Docker Hub Push"
    needs: [strix-relay-rust-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Rust Relay Image & Verify Binary
        run: |
          docker build \
            -t eriktonon/oniontalk:${RELAY_VERSION_TAG} \
            -t eriktonon/oniontalk:v1.5.6 \
            -t eriktonon/oniontalk:latest \
            .
          docker run --rm --entrypoint /bin/sh eriktonon/oniontalk:${RELAY_VERSION_TAG} -c "test -x /usr/local/bin/oniontalk-relay-rs && echo '[OK] Rust Native Relay Binary Verified'"

      - name: Push Verified Relay Images to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push eriktonon/oniontalk:${RELAY_VERSION_TAG}
            docker push eriktonon/oniontalk:v1.5.6
            docker push eriktonon/oniontalk:latest
          else
            echo "[INFO] DOCKERHUB secrets not configured; skipping remote registry push."
          fi
