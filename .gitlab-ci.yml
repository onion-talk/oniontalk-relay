stages:
  - security_test

strix_relay_rust_gate:
  stage: security_test
  image:
    name: rust:slim-bookworm
    pull_policy: [if-not-present, always]
  variables:
    CARGO_HOME: "/cache/cargo-relay"
  script:
    - command -v cc >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev git pkg-config libssl-dev ca-certificates && rm -rf /var/lib/apt/lists/*)
    - cargo test --release --locked -- --nocapture
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
