name: Security Gate — OnionTalk Relay Rust Native (Zero-Leak & Strix)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix-relay-rust-gate:
    name: "🦀 Strix Relay Rust Native Zero-Leak & Protocol Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary & Run Strix Relay Security Gate (Zero-Leak + HTTP 426 + HTTP 401 + Health)
        run: |
          cargo test --release --locked -- --nocapture
          cargo build --release --locked
