[package]
name = "oniontalk-relay-rs"
version = "1.5.5"
edition = "2021"
description = "Sovereign Zero-Trust High-Performance Tor v3 Relay Engine for OnionTalk & OnionVoice V1"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
data-encoding = "2.6"
rand = "0.8"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
futures-util = "0.3"
tokio-stream = "0.1"
chrono = "0.4"
bytes = "1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
